<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="{{ page.title }} | {{ site.title }}" data-tr="{{ page.title_tr }} | {{ site.title }}">{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/argforge/argforge.css' | relative_url }}">
  {% if page.workspace %}<script src="{{ '/assets/argforge/argforge-core.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/argforge/graph.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/argforge/app.js' | relative_url }}" defer></script>{% else %}<script src="{{ '/assets/argforge/site.js' | relative_url }}" defer></script>{% endif %}
</head>

<body{% if page.workspace %} class="af-wide"{% endif %}>
  {% include header.html %}

  <div class="af-subnav" role="navigation" aria-label="ArgForge">
    <span class="af-title">ArgForge</span>
    <a data-nav="{{ '/argforge/' | relative_url }}" href="{{ '/argforge/' | relative_url }}"{% if page.af == 'intro' %} aria-current="page"{% endif %}><span class="en">Introduction</span><span class="tr">Giriş</span></a>
    <a data-nav="{{ '/argforge/workspace/' | relative_url }}" href="{{ '/argforge/workspace/' | relative_url }}"{% if page.af == 'workspace' %} aria-current="page"{% endif %}><span class="en">Workspace</span><span class="tr">Çalışma alanı</span></a>
    <a data-nav="{{ '/argforge/glossary/' | relative_url }}" href="{{ '/argforge/glossary/' | relative_url }}"{% if page.af == 'glossary' %} aria-current="page"{% endif %}><span class="en">Glossary</span><span class="tr">Sözlük</span></a>
    <a data-nav="{{ '/argforge/report/' | relative_url }}" href="{{ '/argforge/report/' | relative_url }}"{% if page.af == 'report' %} aria-current="page"{% endif %}><span class="en">Report</span><span class="tr">Rapor</span></a>
    <label class="inline"><span class="en">Language</span><span class="tr">Dil</span>
      <select id="language">
        <option value="ENG">English</option>
        <option value="TUR">Türkçe</option>
      </select></label>
  </div>

  <main{% unless page.workspace %} class="page"{% endunless %}>
    {{ content }}
  </main>

  <script src="{{ '/assets/js/external-links.js' | relative_url }}"></script>
</body>
</html>
